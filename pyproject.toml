[project]
name = "game-metrics"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    { name = "volodymyr-spitsyn", email = "vspitsyn1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.148.0",
    "greenlet>=3.5.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
game-metrics = "game_metrics:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true
